name: CI

# Pipeline CI (push / PR) :
#  - app     : flutter analyze + flutter test + flutter build web
#  - backend : dart analyze
#  - e2e     : tests `flutter drive` (sous-ensemble représentatif) avec
#              PostgreSQL + le backend de synchronisation + Chrome sous Xvfb.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  app:
    name: App Flutter (analyze · test · build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # --no-fatal-infos : on échoue sur warnings/erreurs, on tolère les infos
      # (style + dépréciations dues au drift de version Flutter de la CI).
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release

  backend:
    name: Backend Dart (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  e2e:
    name: Tests E2E (PostgreSQL + backend + Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bej_ci_pwd
          POSTGRES_DB: bej
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: bej_ci_pwd
      DISPLAY: ":99"
      # L'app de test est servie sur localhost:5000 (voir --web-port ci-dessous) ;
      # le backend doit autoriser cette origine (CORS restreint depuis le
      # durcissement sécurité : plus de « * »).
      BEJ_CORS_ORIGIN: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: nanasess/setup-chromedriver@v2
      - name: Dépendances système (psql + xvfb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client xvfb
      - name: Schéma + seed PostgreSQL (001 → 011)
        run: |
          for f in backend/schema/0*.sql; do
            echo "==> $f"
            psql -h localhost -U postgres -d bej -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Démarrer le backend de synchronisation
        working-directory: backend/server
        run: |
          dart pub get
          nohup dart run bin/server.dart > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && { echo "backend prêt"; break; }
            sleep 2
          done
          curl -sf http://localhost:8080/health || { echo "backend KO"; cat "$RUNNER_TEMP/backend.log"; exit 1; }
      - name: Tests E2E (flutter drive, Chrome sous Xvfb)
        working-directory: app
        run: |
          flutter pub get
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          chromedriver --port=4444 >/dev/null 2>&1 &
          sleep 3
          set -e
          for t in phase0_test finitions_test suivi_appareil_test qr_labels_test; do
            echo "::group::flutter drive $t"
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/$t.dart \
              -d web-server --web-port=5000 --browser-name=chrome
            echo "::endgroup::"
          done
