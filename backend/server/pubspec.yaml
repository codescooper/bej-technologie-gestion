name: bej_backend
description: >-
  Backend de synchronisation BEJ Technologie (Phase 0).
  Reçoit les mutations hors-ligne de l'app (file CRUD PowerSync) et les
  applique au PostgreSQL serveur. Sert aussi un jeton de dev pour l'auth.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  postgres: ^3.5.0

dev_dependencies:
  lints: ^5.0.0
